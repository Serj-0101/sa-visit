<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Альбом</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-glass: rgba(30, 41, 59, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ЭКРАН ВХОДА --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #login-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .login-box {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
            transform: translateY(0);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="password"]::placeholder {
            color: #64748b;
        }
        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }

        #login-error {
            color: var(--error);
            font-size: 14px;
            margin-top: 16px;
            display: none;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* --- ЭКРАН АЛЬБОМА --- */
        #album-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease-out;
        }
        #album-screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-glass);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header button {
            width: auto;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            font-size: 14px;
        }
        .header button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .upload-area {
            background: var(--bg-glass);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 50px 30px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.05);
        }
        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-area h3 {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .upload-area p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* --- ГАЛЕРЕЯ --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-item {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 1 / 1;
        }
        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            color: var(--error);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 8px;
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        .gallery-item:hover .delete-btn {
            opacity: 1;
            transform: translateY(0);
        }
        .delete-btn:hover {
            background: var(--error);
            color: white;
        }

        /* --- СТАТУС И ЗАГРУЗКА --- */
        .status-msg {
            text-align: center;
            color: var(--accent);
            margin-bottom: 24px;
            font-weight: 500;
            padding: 12px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            display: none;
            backdrop-filter: blur(5px);
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Вход в альбом</h2>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <div id="login-error">Неверный пароль</div>
        </div>
    </div>

    <div id="album-screen">
        <div class="header">
            <h1>Облачное фотохранилище ☁️</h1>
            <button onclick="logout()">Выйти</button>
        </div>

        <div class="status-msg" id="status-msg">Синхронизация с облаком...</div>

        <div class="upload-area" id="upload-area">
            <h3>Нажмите или перетащите фотографии сюда</h3>
            <p>Они навсегда сохранятся в интернете</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">
            <div class="loader" id="upload-loader"></div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // ==========================================
        // === НАСТРОЙКИ ОБЛАКА (ОБЯЗАТЕЛЬНО!) ===
        // ==========================================
        
        const IMGBB_API_KEY = '6a8307442db5a174c3e97d1ab8d4f1df'; 
        const JSONBIN_API_KEY = '$2a$10$e1.L2mPRXuBWLDueSAqqze7Gp6fixzviPGaXWctlgqeqBUZTYkuUW'; 
        const BIN_ID = '$2a$10$4isn3dLfG58m2lBRsgFxE.BoQ9k3bOEzDrcF01pZKI7wUJlzHlWrG'; 
        const CORRECT_PASSWORD = '1234'; 
        
        // ==========================================

        let cloudPhotos = [];

        // --- АВТОРИЗАЦИЯ ---
        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === CORRECT_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('album-screen').classList.add('active');
                loadGalleryFromCloud();
            } else {
                const err = document.getElementById('login-error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('album-screen').classList.remove('active');
            document.getElementById('password-input').value = '';
            cloudPhotos = []; 
        }

        // --- РАБОТА С ОБЛАКОМ (JSONBin) ---
        async function fetchCloudData() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${new Date().getTime()}`, {
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                },
                cache: 'no-store'
            });
            
            if (!res.ok) {
                throw new Error(`Ошибка загрузки: ${res.status} ${res.statusText}.`);
            }
            
            const data = await res.json();
            return data.record?.photos || [];
        }

        async function saveCloudData(photosArray) {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify({ photos: photosArray })
            });
            
            if (!res.ok) {
                throw new Error(`Ошибка сохранения: ${res.status} ${res.statusText}`);
            }
        }

        // --- ЗАГРУЗКА ФОТО (ImgBB) ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadToImgBB(file) {
            const base64Image = await getBase64(file);
            const formData = new FormData();
            formData.append('image', base64Image.split(',')[1]);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!data.success) throw new Error('Ошибка ImgBB');
            return data.data.display_url;
        }

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function loadGalleryFromCloud() {
            const status = document.getElementById('status-msg');
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            status.innerText = 'Загрузка данных из облака...';
            status.style.display = 'block';

            try {
                cloudPhotos = await fetchCloudData();
                status.style.display = 'none';
                renderGallery();
            } catch (e) {
                status.innerText = 'Ошибка подключения к облаку! Проверьте BIN_ID.';
                status.style.color = 'var(--error)';
                console.error('Ошибка JSONBin:', e);
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            if (cloudPhotos.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); font-size: 16px; padding: 40px 0;">Альбом пуст. Загрузите первую фотографию!</p>';
                return;
            }

            cloudPhotos.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${url}" alt="Фото" loading="lazy" onerror="this.parentElement.remove()">
                    <button class="delete-btn" onclick="deletePhoto(${index})">Удалить</button>
                `;
                gallery.appendChild(item);
            });
        }

        async function handleFiles(files) {
            const loader = document.getElementById('upload-loader');
            const uploadArea = document.getElementById('upload-area');
            const status = document.getElementById('status-msg');
            
            loader.style.display = 'block';
            uploadArea.style.pointerEvents = 'none';
            status.style.display = 'block';
            status.style.color = 'var(--text-main)';

            let newPhotos = [];

            for (let i = 0; i < files.length; i++) {
                status.innerText = `Загрузка файла ${i + 1} из ${files.length}...`;
                try {
                    const url = await uploadToImgBB(files[i]);
                    newPhotos.push(url);
                } catch (e) {
                    alert(`Ошибка при загрузке ${files[i].name}`);
                }
            }

            status.innerText = 'Сохранение базы данных в облако...';
            try {
                const currentCloudData = await fetchCloudData();
                cloudPhotos = [...currentCloudData, ...newPhotos];
                
                await saveCloudData(cloudPhotos);
                status.style.display = 'none';
            } catch (e) {
                status.innerText = 'ОШИБКА сохранения базы данных! Проверьте BIN_ID.';
                status.style.color = 'var(--error)';
                // Исправлена синтаксическая ошибка (было 'f e')
                console.error('Ошибка сохранения:', e); 
            }
            
            loader.style.display = 'none';
            uploadArea.style.pointerEvents = 'auto';
            document.getElementById('file-input').value = '';
            renderGallery();
        }

        async function deletePhoto(index) {
            if(!confirm('Удалить это фото навсегда?')) return;
            
            const status = document.getElementById('status-msg');
            status.style.display = 'block';
            status.style.color = 'var(--text-main)';
            status.innerText = 'Обновление облака...';

            try {
                cloudPhotos = await fetchCloudData();
                cloudPhotos.splice(index, 1); 
                
                await saveCloudData(cloudPhotos);
                status.style.display = 'none';
            } catch (e) {
                status.innerText = 'Ошибка удаления из облака!';
                status.style.color = 'var(--error)';
                console.error(e);
            }
            renderGallery();
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
